<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuralOrbit — Website Module (Admin)</title>
    <meta name="description" content="NeuralOrbit Admin Website — cross-user UX decisions and conversion AI activity" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="../css/theme.css" /><link rel="stylesheet" href="../css/layout.css" /><link rel="stylesheet" href="../css/components.css" />
</head>
<body data-module="admin-website" data-role="admin">
    <div id="app-shell" class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="main-area" id="main-area">
            <header id="topnav" class="topnav"></header>
            <main id="page-content" class="page-content"><div class="page-loading"><div class="loading-spinner"></div></div></main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="../js/config.js"></script>
    <script src="../js/supabase-client.js"></script><script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
    <script src="../js/guard.js"></script><script src="../js/shell.js"></script>
    <script src="../js/router.js"></script><script src="../js/overview.js"></script>
    <script src="../js/decision-log.js"></script><script src="../js/reward-engine.js"></script>
    <script src="../js/autonomy.js"></script><script src="../js/learning.js"></script>
    <script src="../js/sandbox.js"></script><script src="../js/modules.js"></script>
    <script src="../js/admin-module-page.js"></script>
    <script src="../js/app.js"></script>
    <script>
    /* Admin Website Page — config only; shared logic in js/admin-module-page.js */
    window.loadWebsiteAdminPage = window.createAdminModulePage({
        module: 'website',
        idPrefix: 'web',
        title: 'Website Module',
        subtitle: 'All-user UX decisions, bounce rate AI alerts, and conversion activity.',
        kpiDefs: [
            { key: 'bounce_rate', label: 'Avg Bounce Rate', icon: 'bi-box-arrow-right', color: '#EF4444', suffix: '%' },
            { key: 'conversion_rate', label: 'Conversion Rate', icon: 'bi-funnel-fill', color: '#22C55E', suffix: '%' },
            { key: 'page_views', label: 'Page Views (7d)', icon: 'bi-eye-fill', color: '#5B8CFF' },
            { key: 'avg_session', label: 'Avg Session', icon: 'bi-clock-fill', color: '#F59E0B', suffix: 's' },
        ],
        demoDecisions: [
            { id: 'w1', module: 'website', action: 'Landing page optimization needed — bounce rate at 68%', outcome: 'pending', confidence: 0.78, observe_only: false, auto_executed: false, created_at: new Date().toISOString(), reasoning: 'Bounce rate 68% over 3 days, above 40% threshold.' },
            { id: 'w2', module: 'website', action: 'Conversion funnel review required — no conversions in 3 days', outcome: 'applied', confidence: 0.91, observe_only: false, auto_executed: true, created_at: new Date(Date.now() - 86400000).toISOString(), reasoning: 'No form submissions in 3 days. CTA review needed.' },
            { id: 'w3', module: 'website', action: 'A/B test hero headline — current version underperforming', outcome: 'pending', confidence: 0.69, observe_only: true, auto_executed: false, created_at: new Date(Date.now() - 172800000).toISOString(), reasoning: 'Observe mode: CTR on hero CTA dropped 15%.' },
            { id: 'w4', module: 'website', action: 'Reduce image sizes on pricing page — load time 6.2s', outcome: 'rejected', confidence: 0.74, observe_only: false, auto_executed: false, created_at: new Date(Date.now() - 259200000).toISOString(), reasoning: 'Pricing page load time high. Compression recommended.' },
        ],
    });
    </script>
</body>
</html>
